[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rookie-cli"
version = "1.0.0"
description = "ROOKIE mirror downloader and Quest sideloader"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
rookie = "rookie:main"

[tool.setuptools]
py-modules = ["rookie"]
